# XT-Player CI/CD — every build runs on GitHub-hosted macOS runners.
#
#  push / PR        → unit tests + unsigned builds for iOS/iPadOS, tvOS, macOS (downloadable artifacts)
#  tag v*           → same, plus a GitHub Release with the .ipa / .zip files attached
#  manual (Run workflow, "testflight" ticked) or tag v* with repo variable TESTFLIGHT_ON_TAG=true
#                   → signed archive + upload to TestFlight (needs the App Store Connect secrets, see README)
name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths-ignore: ["**/*.md", "Assets/Branding/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload iOS + tvOS builds to TestFlight"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PROJECT: XTPlayer.xcodeproj
  SPM_DIR: .spm

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run tests
        env:
          XCODE_LOG: build-test.log
        run: |
          .github/scripts/xcodebuild.sh test \
            -project "$PROJECT" \
            -scheme XTPlayerTests \
            -destination 'platform=macOS'

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-log
          path: build-test.log
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: XTPlayer-iOS
            destination: generic/platform=iOS
            sdk_dir: iphoneos
          - platform: tvOS
            scheme: XTPlayer-tvOS
            destination: generic/platform=tvOS
            sdk_dir: appletvos
          - platform: macOS
            scheme: XTPlayer-macOS
            destination: generic/platform=macOS
            sdk_dir: macos
    steps:
      - uses: actions/checkout@v6

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Cache Swift packages (MPVKit binaries)
        uses: actions/cache@v5
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "${{ matrix.scheme }}" \
            -clonedSourcePackagesDirPath "$SPM_DIR"

      - name: Archive (unsigned)
        env:
          XCODE_LOG: build-${{ matrix.platform }}.log
        run: |
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            # Ad-hoc signature so the app launches on Apple Silicon (right-click ▸ Open the first time).
            # Hardened Runtime stays off here: its library validation rejects ad-hoc signed embedded frameworks.
            SIGNING=(CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= ENABLE_HARDENED_RUNTIME=NO)
          else
            SIGNING=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=)
          fi
          .github/scripts/xcodebuild.sh archive \
            -project "$PROJECT" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -archivePath "build/XTPlayer-${{ matrix.platform }}.xcarchive" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -disableAutomaticPackageResolution \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${SIGNING[@]}"

      - name: Package
        id: package
        run: |
          set -euo pipefail
          APP="build/XTPlayer-${{ matrix.platform }}.xcarchive/Products/Applications/XTPlayer.app"
          test -d "$APP" || { echo "::error::XTPlayer.app missing from archive"; exit 1; }
          if [ "${{ matrix.platform }}" = "macOS" ]; then PLIST="$APP/Contents/Info.plist"; else PLIST="$APP/Info.plist"; fi
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          NAME="XTPlayer-${VERSION}-${{ github.run_number }}-${{ matrix.platform }}"
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${NAME}.zip"
          else
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry "dist/${NAME}-unsigned.ipa" Payload
          fi
          ls -lh dist
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.platform }} — v${VERSION} (build ${{ github.run_number }})"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP="build/XTPlayer-${{ matrix.platform }}.xcarchive/Products/Applications/XTPlayer.app"
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            RES="$APP/Contents/Resources"; PLIST="$APP/Contents/Info.plist"; BIN="$APP/Contents/MacOS/XTPlayer"; FW="$APP/Contents/Frameworks"
          else
            RES="$APP"; PLIST="$APP/Info.plist"; BIN="$APP/XTPlayer"; FW="$APP/Frameworks"
          fi
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" 2>/dev/null || echo "-"; }
          MINOS=$(plist MinimumOSVersion); [ "$MINOS" = "-" ] && MINOS=$(plist LSMinimumSystemVersion)
          ICON_NAME=$(plist CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName); [ "$ICON_NAME" = "-" ] && ICON_NAME=$(plist CFBundleIconName)
          ICONS=$(xcrun assetutil --info "$RES/Assets.car" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d if "Icon" in str(r.get("Name","")) or "Shelf" in str(r.get("Name",""))))')
          LINKED=$(xcrun otool -L "$BIN")
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            codesign --verify --deep --strict "$APP" && echo "codesign: valid (ad-hoc)"
            codesign -d --entitlements :- "$APP" 2>/dev/null | grep -c "<key>" | xargs -I{} echo "entitlements: {} keys"
          fi
          MPVBIN=$(find "$FW/Libmpv.framework" -maxdepth 3 -type f -name Libmpv | head -n 1)
          MPVTYPE=$( [ -n "$MPVBIN" ] && file -b "$MPVBIN" | cut -c1-60 || echo "-")
          echo "otool -L:"; echo "$LINKED" | head -n 40
          echo "Libmpv binary: $MPVBIN ($MPVTYPE)"
          MPVID=$( [ -n "$MPVBIN" ] && xcrun otool -D "$MPVBIN" | tail -n 1 || echo "-")
          # mpv_render_context_create only exists inside libmpv itself (the app never references it).
          if grep -qi "libmpv" <<<"$LINKED"; then
            LIBMPV="dynamic"
          elif xcrun nm -a "$BIN" 2>/dev/null | grep -q "mpv_render_context_create"; then
            LIBMPV="static"
          else
            LIBMPV="MISSING"
          fi
          DEPS=$(echo "$LINKED" | tail -n +2 | awk '{print $1}' | sed -E 's#.*/##' | tr '\n' ' ')
          echo "::notice title=${{ matrix.platform }} libmpv::linkage=$LIBMPV · Libmpv id: $MPVID · type: $MPVTYPE · binary links: $DEPS"
          ICON_KEYS=$(plutil -convert json -o - "$PLIST" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(",".join(sorted(k for k in d if "Icon" in k or "TopShelf" in k)))')
          FWS=$( [ -d "$FW" ] && ls "$FW" | tr '\n' ' ' || echo none)
          MSG="$(plist CFBundleIdentifier) v$(plist CFBundleShortVersionString) ($(plist CFBundleVersion)) · min OS $MINOS · $(lipo -archs "$BIN") · $(du -sh "$APP" | cut -f1) · icon '$ICON_NAME' [$ICON_KEYS] ($ICONS renditions) · libmpv $LIBMPV · frameworks: $FWS"
          echo "$MSG"
          echo "::notice title=${{ matrix.platform }} bundle::$MSG"
          [ "$LIBMPV" != "MISSING" ] || { echo "::error::libmpv is not linked into the binary"; exit 1; }
          [ "$ICONS" -gt 0 ] || { echo "::error::No app icon renditions in Assets.car"; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.platform }}
          path: build-*.log
          if-no-files-found: ignore

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
          pattern: XTPlayer-*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "XT-Player $GITHUB_REF_NAME" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == v0.* ]] && echo --prerelease)

  testflight:
    name: TestFlight ${{ matrix.platform }}
    if: (github.event_name == 'workflow_dispatch' && inputs.testflight) || (startsWith(github.ref, 'refs/tags/v') && vars.TESTFLIGHT_ON_TAG == 'true')
    needs: test
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: XTPlayer-iOS
            destination: generic/platform=iOS
          - platform: tvOS
            scheme: XTPlayer-tvOS
            destination: generic/platform=tvOS
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.xuanthanhtnt.xtplayer' }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (Settings ▸ Secrets and variables ▸ Actions). See README › TestFlight."
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive (cloud-managed signing)
        run: |
          .github/scripts/xcodebuild.sh archive \
            -project "$PROJECT" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -archivePath "build/XTPlayer-${{ matrix.platform }}.xcarchive" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export & upload to TestFlight
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "build/XTPlayer-${{ matrix.platform }}.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded ${{ matrix.platform }} build ${{ github.run_number }} to App Store Connect." >> "$GITHUB_STEP_SUMMARY"
